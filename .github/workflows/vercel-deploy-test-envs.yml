name: Vercel Deploy (Test Envs)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Link Vercel project
        # Prefer checked-in .vercel/project.json (hsbexpo) over stale secret IDs
        # that previously targeted the wrong project (hyperlinksspaceprsbot).
        run: |
          ORG_ID=$(node -p "require('./.vercel/project.json').orgId")
          PROJECT_ID=$(node -p "require('./.vercel/project.json').projectId")
          echo "VERCEL_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Linked org=$ORG_ID project=$PROJECT_ID"

      - name: Deploy to Vercel
        # Full remote build (not --prebuilt) so /api serverless routes stay intact.
        run: npx vercel@38.0.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SKIP_DB_MIGRATE: "1"
